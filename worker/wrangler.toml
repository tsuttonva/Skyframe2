name = "skyframe2-worker"
main = "src/index.js"
compatibility_date = "2024-09-01"

# Weekly military hex-range DB rebuild: Monday 06:00 UTC.
[triggers]
crons = ["0 6 * * 1"]

[vars]
APP_VERSION = "1.0.0"
AEROAPI_MONTHLY_CAP = "800"
# Your email address for 75%/100% usage-cap warnings. Not a secret, but you
# may also set it via `wrangler secret put ALERT_EMAIL` if you'd rather not
# commit it.
ALERT_EMAIL = "you@example.com"

# Created with: npx wrangler kv namespace create SKYFRAME2_KV
# Named distinctly from the original app's SKYFRAME_KV so both versions can
# run side by side without sharing or clobbering state.
# Paste the "id" it prints below.
[[kv_namespaces]]
binding = "SKYFRAME2_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
