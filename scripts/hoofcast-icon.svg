<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#231506"/>
      <stop offset="100%" stop-color="#0a0602"/>
    </radialGradient>
    <linearGradient id="shoe" x1="256" y1="120" x2="256" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffd98a"/>
      <stop offset="55%" stop-color="#e6a636"/>
      <stop offset="100%" stop-color="#a8681c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#ffcf6b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffcf6b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="220" fill="url(#glow)"/>

  <!-- horseshoe: thick ring with a gap at the top, rotated so the gap faces up -->
  <g transform="rotate(90 256 268)">
    <circle cx="256" cy="268" r="132" fill="none" stroke="url(#shoe)"
      stroke-width="58" stroke-linecap="round"
      stroke-dasharray="686 143" stroke-dashoffset="-548"/>
  </g>

  <!-- nail holes along the shoe -->
  <g fill="#3a2408">
    <circle cx="153" cy="220" r="9"/>
    <circle cx="139" cy="278" r="9"/>
    <circle cx="163" cy="334" r="9"/>
    <circle cx="359" cy="220" r="9"/>
    <circle cx="373" cy="278" r="9"/>
    <circle cx="349" cy="334" r="9"/>
  </g>

  <!-- small trail dots beneath, echoing the radar-ring motif from the sibling app -->
  <g fill="#e6a636" opacity="0.55">
    <circle cx="216" cy="410" r="6"/>
    <circle cx="256" cy="422" r="6"/>
    <circle cx="296" cy="410" r="6"/>
  </g>
</svg>
