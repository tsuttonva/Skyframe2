name = "atc-explorer-worker"
main = "src/index.js"
compatibility_date = "2024-09-01"

[vars]
# Comma-separated origins allowed to call this API from a browser.
ALLOWED_ORIGINS = "https://tsuttonva.github.io,http://localhost:8788,http://127.0.0.1:8788"

# Separate namespace from SkyFrame's SKYFRAME2_KV so the two apps never share or
# clobber state. The id is filled in at deploy time by scripts/ensure-kv.mjs
# (finds the namespace titled "atc-explorer-kv" or creates it), so nobody has to
# create it by hand. NOTE: KV's free-tier daily caps are per ACCOUNT, so writes
# here draw on the same 1,000/day budget as SkyFrame -- see docs/RATE_LIMITS.md.
[[kv_namespaces]]
binding = "ATC_KV"
id = "REPLACED_AT_DEPLOY"
