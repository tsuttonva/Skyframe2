name: Deploy Pages

on:
  push:
    # Only the branch allow-listed in the github-pages environment's deployment
    # branch policy can actually deploy; other branches merge into this one
    # to publish (see README) rather than listing them here, since a push-only
    # trigger from a non-allow-listed branch fails instantly on the
    # environment protection check, not on anything in this workflow.
    branches: [claude/cross-platform-app-build-vtwr2l]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble combined site (SkyFrame at /, HoofCast at /hoofcast)
        run: |
          mkdir -p dist
          cp -r web/. dist/
          mkdir -p dist/hoofcast
          cp -r hoofcast/. dist/hoofcast/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
